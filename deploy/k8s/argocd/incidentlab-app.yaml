# Argo CD Application: keep namespace "incidentlab" in sync with deploy/k8s/base on GitHub.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incidentlab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sreerajraveendran/incidentlab.git
    targetRevision: main
    path: deploy/k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: incidentlab
  syncPolicy:
    automated:
      prune: true # deleted from Git -> deleted from the cluster
      selfHeal: true # changed by hand -> changed back to what Git says
    syncOptions:
      - RespectIgnoreDifferences=true
    # Automated sync does not retry a failed sync of the same Git revision on its
    # own. Transient failures (an admission webhook or DNS not ready yet after a
    # Docker restart) would otherwise leave the app failed until the next commit.
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
  # Runtime changes that are expected, not drift:
  ignoreDifferences:
    # The dashboard's load buttons scale the load generator.
    - group: apps
      kind: Deployment
      name: incidentlab-loadgen
      jsonPointers: [/spec/replicas]
    # k8s-up.ps1 restarts pods after loading new images.
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.metadata.annotations."kubectl.kubernetes.io/restartedAt"'
    # The Lab API keeps incident runs in this ConfigMap's data.
    - kind: ConfigMap
      name: incidentlab-lab-state
      jsonPointers: [/data]
