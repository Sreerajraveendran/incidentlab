# Argo CD Application: keep namespace "minicloud" in sync with deploy/k8s/base on GitHub.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sreerajraveendran/minicloud.git
    targetRevision: main
    path: deploy/k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: minicloud
  syncPolicy:
    automated:
      prune: true # deleted from Git -> deleted from the cluster
      selfHeal: true # changed by hand -> changed back to what Git says
    syncOptions:
      - RespectIgnoreDifferences=true
  # Runtime changes that are expected, not drift:
  ignoreDifferences:
    # The dashboard's load buttons scale the load generator.
    - group: apps
      kind: Deployment
      name: minicloud-loadgen
      jsonPointers: [/spec/replicas]
    # k8s-up.ps1 restarts pods after loading new images.
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.metadata.annotations."kubectl.kubernetes.io/restartedAt"'
