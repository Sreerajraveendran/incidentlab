# Kubernetes Ingress: HTTP routing rules that the ingress-nginx controller applies.
# It replaced the hand-written NGINX gateway of the Compose stage, as an object instead of a config file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minicloud
spec:
  ingressClassName: nginx # handled by the ingress-nginx controller (deploy/k8s/ingress-nginx)
  rules:
    - http:
        paths:
          # Longest prefix wins, so /api/mgmt goes to the management API, not the app.
          - path: /api/mgmt
            pathType: Prefix
            backend:
              service: { name: minicloud-mgmt-api, port: { number: 8000 } }
          - path: /api
            pathType: Prefix
            backend:
              service: { name: minicloud-app, port: { number: 8000 } }
          - path: /health
            pathType: Prefix
            backend:
              service: { name: minicloud-app, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: minicloud-web, port: { number: 8080 } }
