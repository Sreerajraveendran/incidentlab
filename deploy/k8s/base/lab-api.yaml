# Lab API with least-privilege access: exactly what the visualizer needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incidentlab-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incidentlab-api
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  # Scale the load generator only, nothing else.
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [incidentlab-loadgen]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incidentlab-api
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: incidentlab-api }
subjects:
  - { kind: ServiceAccount, name: incidentlab-api, namespace: incidentlab }
---
# Nodes are cluster-scoped, so reading them needs a (read-only) ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incidentlab-api-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incidentlab-api-nodes
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: incidentlab-api-nodes }
subjects:
  - { kind: ServiceAccount, name: incidentlab-api, namespace: incidentlab }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentlab-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: incidentlab-api }
  template:
    metadata:
      labels: { app: incidentlab-api }
    spec:
      serviceAccountName: incidentlab-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: incidentlab-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: TARGET_NAMESPACE, value: incidentlab }
            - name: API_TOKEN
              valueFrom: { secretKeyRef: { name: incidentlab-secrets, key: API_TOKEN } }
          readinessProbe:
            httpGet: { path: /api/lab/health, port: http }
            # The default 1 s timeout expired when the node's CPU was saturated by a load test.
            timeoutSeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: incidentlab-api
spec:
  selector: { app: incidentlab-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
