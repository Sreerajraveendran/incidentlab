worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format lb '$time_iso8601 $request_id "$request" status=$status '
                  'upstream=$upstream_addr upstream_status=$upstream_status '
                  'request_time=$request_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    # Cluster DNS. The app's headless Service resolves to one A record per
    # *ready* pod, re-read every 5 s: pods the HPA adds join the rotation once
    # their readiness probe passes, and pods being removed drop out.
    # The DNS Service's fixed ClusterIP (kind's default service range), not its
    # name: NGINX resolves a resolver *name* once at startup, and crashed when it
    # started before cluster DNS was ready (e.g. after Docker Desktop restarts).
    resolver 10.96.0.10 valid=5s ipv6=off;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream app_pods {
        zone app_pods 64k;
        # Round-robin per request across pod IPs (like an ingress controller),
        # instead of per connection through the ClusterIP Service.
        server minicloud-app-pods.minicloud.svc.cluster.local:8000 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Service names in variables are resolved per request through the
        # resolver above, so NGINX starts even if these Services aren't ready yet.
        set $mgmt_api http://minicloud-mgmt-api.minicloud.svc.cluster.local:8000;
        set $web http://minicloud-web.minicloud.svc.cluster.local:8080;

        location /api/mgmt/ {
            proxy_pass $mgmt_api;
        }

        location /api/ {
            proxy_pass http://app_pods;
            add_header X-Upstream $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
            add_header X-Gateway-Connect-Time $upstream_connect_time always;
            add_header X-Gateway-Header-Time $upstream_header_time always;
            add_header X-Gateway-Request-Id $req_id always;
        }

        location /health/ {
            proxy_pass http://app_pods;
        }

        location / {
            proxy_pass $web;
        }

        error_page 502 503 504 = @no_backend;
        location @no_backend {
            default_type application/json;
            return 503 '{"error":"no backend available","request_id":"$req_id"}\n';
        }
    }
}
