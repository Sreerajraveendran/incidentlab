# API gateway: NGINX in front of the app pods, the web UI and the management API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minicloud-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: minicloud-gateway }
  template:
    metadata:
      labels: { app: minicloud-gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits: { cpu: 250m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
      volumes:
        - name: conf
          configMap: { name: gateway-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: minicloud-gateway
spec:
  type: NodePort
  selector: { app: minicloud-gateway }
  ports:
    # nodePort 30090 is published on 127.0.0.1:8090 by kind-config.yaml.
    - { name: http, port: 80, targetPort: http, nodePort: 30090 }
