apiVersion: apps/v1
kind: Deployment
metadata:
  name: minicloud-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: minicloud-web }
  template:
    metadata:
      labels: { app: minicloud-web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: minicloud-web:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: minicloud-web
spec:
  selector: { app: minicloud-web }
  ports: [{ name: http, port: 8080, targetPort: http }]
