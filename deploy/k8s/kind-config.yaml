# kind cluster for MiniCloud: 1 control-plane + 1 worker (fits 8 GB RAM).
# Nodes are Docker containers; pods run inside them on containerd.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: minicloud
nodes:
  - role: control-plane
  - role: worker
    # ingress-nginx listens on port 80 of this node; published on localhost only.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8090
        listenAddress: "127.0.0.1"
        protocol: TCP
