worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Who served each request: $upstream_addr is the app container NGINX picked.
    log_format lb '$time_iso8601 $request_id "$request" status=$status '
                  'upstream=$upstream_addr upstream_status=$upstream_status '
                  'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    # Docker's embedded DNS. With `resolve` below, NGINX re-resolves the app
    # names while running, so a container that is recreated (new IP) or not yet
    # started is picked up without restarting NGINX.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Keep the client's request ID when given, otherwise use NGINX's own.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream app_backend {
        zone app_backend 64k;
        # Round-robin (the default). Open-source NGINX has passive health
        # checks only: after max_fails errors a server is skipped for fail_timeout.
        server app-1:8000 resolve max_fails=1 fail_timeout=10s;
        server app-2:8000 resolve max_fails=1 fail_timeout=10s;
        server app-3:8000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        # A failed instance costs one retry, not a failed request. Only retry
        # when the instance could not be reached: an app's own 503 (e.g. its
        # database is down) is passed through, because retrying it on every
        # instance multiplies load on the thing that is already failing.
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;

        location /api/ {
            proxy_pass http://app_backend;
            # What the gateway did, for the request-flow view: which upstream it
            # picked, how long connecting took and when the first byte came back.
            add_header X-Upstream $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
            add_header X-Gateway-Connect-Time $upstream_connect_time always;
            add_header X-Gateway-Header-Time $upstream_header_time always;
            add_header X-Gateway-Request-Id $req_id always;
        }

        location /health/ {
            proxy_pass http://app_backend;
            add_header X-Upstream $upstream_addr always;
        }

        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            proxy_pass http://web:8080;
        }

        # Controlled error when no app instance is available.
        error_page 502 503 504 = @no_backend;
        location @no_backend {
            default_type application/json;
            return 503 '{"error":"no backend available","request_id":"$req_id"}\n';
        }
    }
}
