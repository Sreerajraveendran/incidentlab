version: 2
# Minor and patch updates only, grouped into one PR per ecosystem and folder.
# Major upgrades (new Python/Node/NGINX versions, breaking libraries) are done
# by hand, so they get tested on the cluster first.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"], update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: pip
    directories: [/app, /lab-api]
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"], update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: docker
    directories: [/app, /web, /lab-api]
    schedule: { interval: weekly }
    groups: { images: { patterns: ["*"], update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly }
    groups: { compose: { patterns: ["*"], update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
